services:
  # 1층: Presentation — 외부에 열리는 유일한 컨테이너
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - app
    networks: [front]
    restart: unless-stopped

  # 2층: Application — front(web과 통신)와 back(db와 통신) 둘 다 연결
  app:
    build: ./app
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: blog
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks: [front, back]
    restart: unless-stopped

  # 3층: Data — back 네트워크에만 있어서 web이나 외부에서 직접 접근 불가
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: blog
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro   # 폴더째 마운트 (macOS에서 단일 파일 마운트는 I/O 오류가 날 수 있음)
    healthcheck:
      # 127.0.0.1(TCP)로 확인해야 초기화가 끝난 뒤에만 healthy가 된다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [back]
    restart: unless-stopped

networks:
  front:
  back:

volumes:
  db-data:
