<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - My Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <div class="card auth-box">
      <div class="tabs">
        <button class="btn" id="tab-login" type="button">로그인</button>
        <button class="btn ghost" id="tab-register" type="button">회원가입</button>
      </div>
      <form id="form">
        <label for="username">아이디</label>
        <input id="username" autocomplete="username" required>

        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <p class="meta" id="hint" hidden>아이디: 영문/숫자/_ 3~30자 · 비밀번호: 6자 이상</p>

        <div class="form-foot">
          <button class="btn" type="submit" id="submit">로그인</button>
        </div>
        <p class="msg error" id="msg"></p>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    let mode = 'login';
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const pw = document.getElementById('password');

    // 다른 사이트로 튕겨나가지 않도록 같은 사이트 경로만 허용
    const nextRaw = getParam('next') || '/';
    const next = nextRaw.startsWith('/') && !nextRaw.startsWith('//') ? nextRaw : '/';

    function setMode(m) {
      mode = m;
      const isLogin = m === 'login';
      tabLogin.className = isLogin ? 'btn' : 'btn ghost';
      tabRegister.className = isLogin ? 'btn ghost' : 'btn';
      submit.textContent = isLogin ? '로그인' : '가입하기';
      pw.autocomplete = isLogin ? 'current-password' : 'new-password';
      document.getElementById('hint').hidden = isLogin;
      msg.textContent = '';
    }
    tabLogin.onclick = () => setMode('login');
    tabRegister.onclick = () => setMode('register');

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      submit.disabled = true;
      msg.textContent = '';
      try {
        const data = await api(`/auth/${mode}`, {
          method: 'POST',
          body: { username: document.getElementById('username').value.trim(), password: pw.value },
        });
        auth.save(data);
        location.href = next;
      } catch (err) {
        msg.textContent = err.message;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
