<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>“ ”을 소개합니다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2b2420;
      --paper: #fbf6ea;
      --paper-dim: #f3e9d2;
      --ink: #2e2a25;
      --ink-soft: #7a6f60;
      --cover: #7c2d12;
      --cover-dark: #5a1f0c;
      --gold: #e8c27a;
      --flip-ms: 900ms;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 30%, #4a3c33 0%, var(--bg) 70%);
      font-family: "Gowun Batang", "Apple SD Gothic Neo", serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    /* ---------- 책 ---------- */
    .stage { width: 100%; perspective: 2400px; }
    .book {
      position: relative;
      margin: 0 auto;
      transform-style: preserve-3d;
      transition: transform var(--flip-ms) ease;
    }
    .book.spread { width: min(960px, 100%, calc((100vh - 170px) * 1.5)); aspect-ratio: 3 / 2; }
    .book.single { width: min(480px, 100%, calc((100vh - 170px) * 0.75)); aspect-ratio: 3 / 4; }
    .book.spread.closed-front { transform: translateX(-25%); }
    .book.spread.closed-back  { transform: translateX(25%); }
    .book.no-anim, .book.no-anim .leaf { transition: none !important; }

    .leaf {
      position: absolute;
      top: 0;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform var(--flip-ms) cubic-bezier(.645,.045,.355,1);
      cursor: pointer;
    }
    .spread .leaf { left: 50%; width: 50%; }
    .single .leaf { left: 0; width: 100%; }
    .leaf.flipped { transform: rotateY(-180deg); }
    .leaf.gone { visibility: hidden; }

    /* 한 페이지. 모든 크기는 페이지 너비(cqw) 기준이라 화면 크기와 상관없이 쪽 나눔이 같아요 */
    .face {
      position: absolute;
      inset: 0;
      container-type: inline-size;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: var(--paper);
    }
    .face.back { transform: rotateY(180deg); }
    .spread .face.front { border-radius: 0 6px 6px 0; box-shadow: inset 22px 0 28px -22px rgba(0,0,0,.4); }
    .spread .face.back  { border-radius: 6px 0 0 6px; box-shadow: inset -22px 0 28px -22px rgba(0,0,0,.4); }
    .single .face { border-radius: 4px 8px 8px 4px; box-shadow: inset 10px 0 18px -12px rgba(0,0,0,.35); }
    .face:not(.cover)::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,90,50,.025) 3px 4px);
    }

    .inner {
      position: absolute;
      inset: 0;
      padding: 14cqw 11cqw 13cqw;
      font-size: 3.4cqw;
      line-height: 1.85;
      overflow: hidden;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .run-head, .page-no {
      position: absolute;
      left: 11cqw;
      right: 11cqw;
      text-align: center;
      font-size: 2.4cqw;
      color: var(--ink-soft);
      letter-spacing: .08em;
    }
    .run-head { top: 6.5cqw; }
    .page-no  { bottom: 6cqw; }

    /* 본문 블록 */
    .inner p { text-indent: 1em; }
    .inner p + p { margin-top: .6em; }
    .inner p.cont { text-indent: 0; }
    .inner h3.q {
      font-size: 4.1cqw;
      line-height: 1.5;
      margin: 1.5em 0 .7em;
    }
    .inner h3.q:first-child { margin-top: 0; }
    .q-mark { color: var(--cover); margin-right: .25em; }
    .inner h4.sub {
      font-size: 3.6cqw;
      line-height: 1.5;
      color: var(--cover-dark);
      margin: 1.2em 0 .45em;
    }
    .inner h4.sub:first-child { margin-top: 0; }
    .inner p.lead {
      text-indent: 0;
      text-align: center;
      font-size: 4.2cqw;
      line-height: 1.6;
      font-weight: 700;
      color: var(--cover-dark);
      margin: .9em 0;
      padding: .8em .4em;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
    }
    .inner blockquote {
      margin: .8em 0;
      padding: .2em 0 .2em 1em;
      border-left: 3px solid var(--gold);
      color: var(--ink-soft);
    }
    .inner blockquote + p { margin-top: 0; }

    /* 표지 */
    .face.cover {
      background:
        linear-gradient(90deg, rgba(0,0,0,.35) 0, rgba(255,255,255,.08) 2%, transparent 6%),
        radial-gradient(circle at 30% 20%, #9a3a18 0%, var(--cover) 45%, var(--cover-dark) 100%);
      color: var(--gold);
    }
    .cover .inner, .divider .inner, .intro .inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .cover .inner { padding: 12cqw; }
    .frame {
      position: absolute;
      inset: 6cqw;
      border: 2px solid rgba(232,194,122,.55);
      border-radius: 4px;
      pointer-events: none;
    }
    .frame::after {
      content: "";
      position: absolute;
      inset: 1.6cqw;
      border: 1px solid rgba(232,194,122,.3);
    }
    .cover h1 {
      font-size: 9cqw;
      line-height: 1.35;
      margin-bottom: 4cqw;
    }
    .blank {
      display: inline-block;
      width: 2.4em;
      height: .95em;
      margin: 0 .08em;
      vertical-align: -.08em;
      border-bottom: .07em dashed var(--gold);
    }
    .kicker { font-size: 3cqw; opacity: .85; line-height: 1.7; }
    .ornament { font-size: 6cqw; margin: 5cqw 0; opacity: .8; }
    .author { font-size: 3cqw; letter-spacing: .3em; margin-top: 8cqw; }

    /* 면지 */
    .face.endpaper {
      background:
        radial-gradient(circle, rgba(124,45,18,.18) 2px, transparent 2.2px) 0 0 / 5cqw 5cqw,
        #efe3c9;
    }

    /* 들어가며 */
    .intro .kicker { color: var(--ink-soft); letter-spacing: .3em; }
    .intro .ornament { color: var(--cover); }
    .intro p { text-indent: 0; font-size: 3.8cqw; line-height: 2; }

    /* 차례 */
    .toc h2 {
      font-size: 5cqw;
      letter-spacing: .4em;
      text-align: center;
      margin-bottom: 10cqw;
    }
    .toc ol { list-style: none; }
    .toc li {
      display: flex;
      align-items: baseline;
      gap: 2cqw;
      padding: 2.5cqw 0;
      border-bottom: 1px dashed rgba(122,111,96,.35);
    }
    .toc .name { font-weight: 700; }
    .toc .role { color: var(--ink-soft); font-size: 2.8cqw; }
    .toc .num { margin-left: auto; color: var(--cover); }

    /* 간지 */
    .face.divider { background: var(--paper-dim); }
    .divider .frame { border-color: rgba(124,45,18,.45); }
    .divider .frame::after { border-color: rgba(124,45,18,.2); }
    .divider .kicker { color: var(--ink-soft); letter-spacing: .3em; }
    .divider .ornament { color: var(--cover); }
    .divider h2 {
      font-size: 8cqw;
      line-height: 1.4;
      color: var(--cover-dark);
    }
    .divider .role { margin-top: 5cqw; font-size: 3.2cqw; color: var(--ink-soft); }

    /* 쪽 나눔 계산용(화면 밖) */
    .measure-host {
      position: absolute;
      left: -10000px;
      top: 0;
      width: 480px;
      height: 640px;
      visibility: hidden;
    }

    /* 책 그림자 */
    .book::after {
      content: "";
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: -5%;
      height: 6%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%);
      filter: blur(6px);
      transform: translateZ(-1px);
      pointer-events: none;
    }

    /* ---------- 컨트롤 ---------- */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #e8dcc6;
      font-size: 0.95rem;
    }
    .controls button {
      font: inherit;
      background: rgba(255,255,255,.08);
      color: #f3e7d0;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background .2s;
    }
    .controls button:hover:not(:disabled) { background: rgba(255,255,255,.18); }
    .controls button:disabled { opacity: .35; cursor: default; }
    #status { min-width: 6em; text-align: center; }
    .hint { color: #a8998a; font-size: .85rem; text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      :root { --flip-ms: 1ms; }
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="book spread" id="book"></div>
  </div>

  <div class="controls">
    <button id="prev" aria-label="이전 페이지">← 이전</button>
    <span id="status">표지</span>
    <button id="next" aria-label="다음 페이지">다음 →</button>
  </div>
  <p class="hint" id="hint">페이지를 클릭하거나 ← → 키, 스와이프로 넘겨 보세요</p>

  <script>
    /* =========================================================
       책 내용 — 사람을 더 소개하려면 people 배열에 추가하세요.
       블록 종류: q(질문) · sub(소제목) · p(문단) · lead(강조 문장) · quote(인용)
       ========================================================= */
    const BOOK = {
      intro: '이 책은 소이레가 사랑하는 사람들, 그리고 소이레를 사랑해 주는 소중한 사람들을 소개하는 책입니다.',
      editor: '소이레 엮음',
    };

    const people = [
      {
        name: '김은수',
        role: '소이레의 명예 언니',
        interview: [
          { q: '당신은 누구인가요?', a: [
            { t: 'lead', text: '은수, 소이레랑 얼굴도 성격도 취향도 많이 닮은 명예 언니' },
          ]},
          { q: '당신은 어떤 사람인가요?', a: [
            { t: 'sub', text: '저는 사람들과 나누는 것을 좋아하는 사람입니다.' },
            { t: 'p', text: '대부분의 사람들은 제 첫인상을 좋지 않게 평가했습니다. 아무래도 쭉 찢어진 눈 때문에, 거짓말을 잘 못하는 직설적인 성격 때문에, 악센트가 많은 경상도 사투리 때문인지는 모르겠으나, 모두가 저의 겉모습을 그렇게 평가했습니다. 그러나 조금 시간을 함께 보내다 보면 사람들은 다 제게 대하여 다르게 말합니다. 다른 사람을 생각하고 걱정하고 사랑하는 마음이 크며 무서웠던 첫인상과는 달리 웃기다는 평가도 해 줍니다.' },
            { t: 'p', text: '저는 처음 다가오기에는 쉽지 않은 사람이지만 한번 제 마음속에 들어오게 되면 정을 많이 주는 성격입니다. 그래서 이 정 때문에 다른 사람들을 아낌없이 사랑해 줄 수 있고, 또 그래서 이 몹쓸 정 때문에 이미 떠나간 사람들을 잘 잊지 못합니다.' },
            { t: 'sub', text: '저는 생각하는 것을 좋아하는 사람입니다.' },
            { t: 'p', text: '오늘 하루를 돌아보고 나 자신을 돌아보고 내 미래를 들여다보기를 좋아하며, 내가 누구이고 또 내가 사랑하는 사람들은 누구인지 성찰과 대화를 통해 알아 가는 것을 좋아합니다.' },
            { t: 'sub', text: '저는 미리 준비하고 계획하는 것을 좋아합니다.' },
            { t: 'p', text: '그리고 저는 완벽주의 성향이 있는 것 같습니다. 그래서 미리 준비하고 계획하는 것을 좋아하고 정해져 있는 것을 따를 때 안정감을 느낍니다. 저와 어울리는 사람들이 다 이렇게 계획을 하며 살아가는 사람들은 아니지만, 안정적인 삶을 추구하고 사고가 바르며 유연한 사람들인 것 같습니다.' },
            { t: 'sub', text: '저는 책 읽는 것을 좋아합니다.' },
            { t: 'p', text: '그리고 사람들과의 대화가 어려울 때면 책을 읽기도 합니다. 『죽음의 수용소에서』라는 책에서는 이런 말을 합니다.' },
            { t: 'quote', text: '고통은 우리에게 주어진 독자적인 문제이므로 감사해야 한다.' },
            { t: 'p', text: '즉 고통은 우리 자신만의 몫이라는 것이죠. 물론 나를 사랑해 주는 사람들에게 이 고통을 나누며 함께 해결해 나갈 수 있지만, 그럼에도 불구하고 이 문제를 최종적으로 풀어 가고 헤쳐 나갈 수 있는 사람은 나밖에 없다는 것을 말하고 있습니다.' },
            { t: 'p', text: '그래서인지 저는 어릴 적부터 고민들이 생기면 다른 사람에게 나누기보다는 스스로 해결해 나가려고 했는데, 그래서 그런지 내면의 깊이가 고통의 깊이보다 더 커지고 있는 것 같고, 그만큼 다른 사람의 힘듦에 잘 대처해 줄 수 있는 것 같습니다.' },
            { t: 'p', text: '그래서인지 제가 기대하는 것, 적어도 제 주위에 있는 사람들은 본인의 아픔을 제게 공유해 주지만 그 힘듦을 제게 전적으로 맡겨서 짐이 되게 하는 사람들은 아닙니다. 본인의 과제를 스스로 감내하면서 성장하는 사람들이며, 저는 성장하는 사람들을 좋아합니다. 그리고 성장하는 사람들이 가득한 저는 복된 사람입니다.' },
            { t: 'lead', text: '사람들과 삶을 나누는 순간을 즐거워합니다! 그리고 언제나 하루하루의 시간 속 새로운 발견을 기다립니다.' },
          ]},
          { q: '당신의 인생에서 가장 임팩트 있었던 경험은?', a: [
            { t: 'p', text: '누군가와의 대화를 통해, 책을 통해, 말씀을 통해, 기도를 통해 삶의 진리를 깨달았던 순간들!' },
          ]},
          { q: '당신은 어떤 사람이 되고 싶은가요?', a: [
            { t: 'p', text: '하루가 지날수록 더 자라나는 사람이 되고 싶어요.' },
            { t: 'lead', text: '어제보다 나은 나!' },
          ]},
          { q: '마지막으로 당신의 인생에서 소이레는 어떤 사람인가요?', a: [
            { t: 'p', text: '나 같아서 애틋하고, 만약 동생이 있다면 이런 기분일까 싶어 챙겨 주고 싶고, 이레가 마냥 행복하기만을 바라는 친구 같은 존재.' },
            { t: 'lead', text: '제 자존감이고 자신감, 자부심이에옹' },
          ]},
        ],
      },
    ];

    /* ========================================================= */

    const ORDINALS = ['첫', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
    const book = document.getElementById('book');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const status = document.getElementById('status');
    const hint = document.getElementById('hint');
    const SINGLE_Q = matchMedia('(max-width: 720px)');
    const FLIP_MS = 900;

    let pages = [];   // 완성된 페이지(.face) 목록
    let leaves = [];  // 화면에 놓인 장(.leaf) 목록
    let mode = 'spread';
    let current = 0;  // 넘어간 장 수
    let timer;

    function el(tag, cls, html) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (html != null) n.innerHTML = html;
      return n;
    }
    function newFace(type, html) {
      const face = el('div', 'face ' + type);
      face.append(el('div', 'inner', html));
      return face;
    }

    function coverFace() {
      const f = newFace('cover', `
        <span class="kicker">소이레의 사람들</span>
        <div class="ornament">❦</div>
        <h1>“<span class="blank"></span>”을<br>소개합니다</h1>
        <span class="kicker">소이레가 사랑하는 사람들,<br>소이레를 사랑해 주는 사람들</span>
        <span class="author">${BOOK.editor}</span>`);
      f.prepend(el('div', 'frame'));
      return f;
    }
    function backCoverFace() {
      const f = newFace('cover', `
        <div class="ornament">✦</div>
        <span class="kicker">곁에 있어 주어 고마워요</span>
        <div class="ornament">✦</div>`);
      f.prepend(el('div', 'frame'));
      return f;
    }
    function introFace() {
      return newFace('intro', `
        <span class="kicker">들어가며</span>
        <div class="ornament">❦</div>
        <p>${BOOK.intro}</p>`);
    }
    function dividerFace(person, i) {
      const f = newFace('divider', `
        <span class="kicker">${ORDINALS[i] ?? i + 1} 번째 사람</span>
        <div class="ornament">❦</div>
        <h2>“${person.name}”를<br>소개합니다</h2>
        <p class="role">${person.role}</p>`);
      f.prepend(el('div', 'frame'));
      return f;
    }

    function renderBlock(b) {
      let n;
      if (b.t === 'q') { n = el('h3', 'q', `<span class="q-mark">Q.</span>${b.text}`); n.dataset.keep = '1'; }
      else if (b.t === 'sub') { n = el('h4', 'sub', b.text); n.dataset.keep = '1'; }
      else if (b.t === 'lead') n = el('p', 'lead', b.text);
      else if (b.t === 'quote') n = el('blockquote', '', b.text);
      else n = el('p', b.cont ? 'cont' : '', b.text);
      n._block = b;
      return n;
    }

    // 본문 블록을 페이지 크기에 맞게 나눠 담아요. 긴 문단은 문장 단위로 다음 쪽에 이어집니다.
    function paginate(blocks, person, host) {
      const out = [];
      let face, inner;
      const start = () => {
        face = newFace('text');
        face.dataset.head = `“${person.name}”를 소개합니다`;
        inner = face.firstChild;
        host.replaceChildren(face);
      };
      const overflows = () => inner.scrollHeight > inner.clientHeight + 1;

      start();
      const queue = [...blocks];
      while (queue.length) {
        const b = queue.shift();
        const node = renderBlock(b);
        inner.append(node);
        if (!overflows()) continue;
        node.remove();

        let placed = false;
        if (b.t === 'p') {
          const s = b.text.split(/(?<=[.!?])\s+/);
          let k = 0;
          for (let i = 1; i < s.length; i++) {
            const test = renderBlock({ ...b, text: s.slice(0, i).join(' ') });
            inner.append(test);
            const over = overflows();
            test.remove();
            if (over) break;
            k = i;
          }
          if (k > 0) {
            inner.append(renderBlock({ ...b, text: s.slice(0, k).join(' ') }));
            queue.unshift({ ...b, text: s.slice(k).join(' '), cont: true });
            placed = true;
          }
        }
        if (!placed) {
          if (!inner.children.length) { inner.append(node); continue; } // 한 쪽보다 큰 블록
          queue.unshift(b);
        }
        // 질문·소제목이 쪽 맨 아래에 홀로 남지 않게 다음 쪽으로
        const carry = [];
        while (inner.lastElementChild?.dataset.keep && inner.children.length > 1) {
          carry.unshift(inner.lastElementChild._block);
          inner.lastElementChild.remove();
        }
        queue.unshift(...carry);
        out.push(face);
        start();
      }
      if (inner.children.length) out.push(face);
      host.replaceChildren();
      return out;
    }

    function buildPages() {
      const host = el('div', 'measure-host');
      document.body.append(host);

      pages = [coverFace(), newFace('endpaper'), introFace()];
      const toc = newFace('toc', '<h2>차례</h2><ol></ol>');
      pages.push(toc);

      people.forEach((person, i) => {
        if (pages.length % 2) pages.push(newFace('blank')); // 간지는 항상 오른쪽 쪽에
        const startPage = pages.length;
        pages.push(dividerFace(person, i));
        const blocks = person.interview.flatMap(({ q, a }) => [{ t: 'q', text: q }, ...a]);
        pages.push(...paginate(blocks, person, host));
        toc.querySelector('ol').append(el('li', '', `
          <span class="name">${person.name}</span>
          <span class="role">${person.role}</span>
          <span class="num">${startPage}</span>`));
      });

      if (pages.length % 2) pages.push(newFace('blank'));
      pages.push(newFace('endpaper'), backCoverFace());

      pages.forEach((face, i) => {
        if (face.dataset.head) face.append(el('span', 'run-head', face.dataset.head));
        if (face.matches('.text, .toc, .intro')) face.append(el('span', 'page-no', i));
      });
      host.remove();
    }

    function buildLeaves() {
      mode = SINGLE_Q.matches ? 'single' : 'spread';
      book.className = 'book ' + mode;
      book.replaceChildren();
      const pairs = [];
      if (mode === 'spread') {
        for (let i = 0; i < pages.length; i += 2) pairs.push([pages[i], pages[i + 1]]);
      } else {
        pages.forEach(p => pairs.push([p, newFace('blank')]));
      }
      leaves = pairs.map(([front, back], idx) => {
        const leaf = el('div', 'leaf');
        const f = front.cloneNode(true); f.classList.add('front');
        const b = back.cloneNode(true);  b.classList.add('back');
        leaf.append(f, b);
        leaf.addEventListener('click', e => {
          if (mode === 'spread') return go(idx < current ? -1 : 1);
          const r = leaf.getBoundingClientRect();
          go(e.clientX - r.left < r.width * 0.3 ? -1 : 1);
        });
        book.append(leaf);
        return leaf;
      });
      hint.textContent = mode === 'spread'
        ? '페이지를 클릭하거나 ← → 키, 스와이프로 넘겨 보세요'
        : '오른쪽을 누르면 다음, 왼쪽을 누르면 이전 페이지예요 · 스와이프도 돼요';
    }

    const maxCurrent = () => mode === 'spread' ? leaves.length : leaves.length - 1;

    function render(moving) {
      leaves.forEach((leaf, i) => {
        const flipped = i < current;
        leaf.classList.toggle('flipped', flipped);
        leaf.style.zIndex = flipped ? i + 1 : leaves.length - i;
        leaf.classList.toggle('gone', mode === 'single' && flipped && i !== moving);
      });
      if (moving != null) leaves[moving].style.zIndex = leaves.length + 1;

      const max = maxCurrent();
      book.classList.toggle('closed-front', current === 0);
      book.classList.toggle('closed-back', current === max);
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === max;
      status.textContent =
        current === 0 ? '표지' :
        current === max ? '뒤표지' :
        mode === 'spread' ? `${2 * current - 1} – ${2 * current} 쪽` : `${current} 쪽`;
    }

    function go(delta) {
      const next = Math.min(maxCurrent(), Math.max(0, current + delta));
      if (next === current) return;
      const moving = delta > 0 ? current : current - 1;
      current = next;
      render(moving);
      clearTimeout(timer);
      timer = setTimeout(() => render(), FLIP_MS);
    }

    prevBtn.addEventListener('click', () => go(-1));
    nextBtn.addEventListener('click', () => go(1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
    });

    let startX = null;
    book.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    book.addEventListener('touchend', e => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (Math.abs(dx) > 40) {
        e.preventDefault(); // 스와이프 뒤에 클릭이 한 번 더 일어나지 않도록
        go(dx < 0 ? 1 : -1);
      }
    });

    // 화면 폭이 바뀌면 펼친 책 ↔ 한 쪽 보기 전환 (보던 쪽 유지)
    SINGLE_Q.addEventListener('change', () => {
      const wasSpread = mode === 'spread';
      const c = current;
      buildLeaves();
      current = wasSpread ? Math.max(0, 2 * c - 1) : Math.ceil(c / 2);
      book.classList.add('no-anim');
      render();
      book.offsetWidth;
      book.classList.remove('no-anim');
    });

    (async () => {
      try {
        await Promise.race([
          Promise.all([
            document.fonts.load('1em "Gowun Batang"'),
            document.fonts.load('700 1em "Gowun Batang"'),
          ]).then(() => document.fonts.ready),
          new Promise(r => setTimeout(r, 2500)),
        ]);
      } catch (_) {}
      buildPages();
      buildLeaves();
      book.classList.add('no-anim');
      render();
      book.offsetWidth;
      book.classList.remove('no-anim');
    })();
  </script>
</body>
</html>
