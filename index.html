<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>26 동아사이언스 멘토링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
    }
    header {
      padding: 96px 24px 72px;
      text-align: center;
      background: radial-gradient(circle at 50% 0%, #1e40af 0%, #0f172a 70%);
    }
    header h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin-bottom: 12px; }
    header p { color: #94a3b8; font-size: 1.1rem; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
    h2 { font-size: 1.5rem; margin-bottom: 20px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 56px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: #3b82f6; }
    .card .icon { font-size: 2rem; margin-bottom: 12px; }
    .card h3 { margin-bottom: 8px; }
    .card p { color: #94a3b8; font-size: 0.95rem; }
    .todo { background: #1e293b; border-radius: 16px; padding: 24px; }
    .todo form { display: flex; gap: 8px; margin-bottom: 16px; }
    .todo input {
      flex: 1; padding: 12px; border-radius: 10px;
      border: 1px solid #334155; background: #0f172a; color: inherit; font-size: 1rem;
    }
    .todo button {
      padding: 12px 20px; border: 0; border-radius: 10px;
      background: #3b82f6; color: white; font-size: 1rem; cursor: pointer;
    }
    .todo button:hover { background: #2563eb; }
    .todo ul { list-style: none; }
    .todo li {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 4px; border-bottom: 1px solid #334155;
    }
    .todo li.done span { text-decoration: line-through; color: #64748b; }
    .todo li .del { margin-left: auto; background: none; color: #64748b; padding: 4px 8px; }
    .todo li .del:hover { color: #f87171; background: none; }
    footer { text-align: center; padding: 32px; color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>🔬 26 동아사이언스 멘토링</h1>
    <p>탐구하고, 기록하고, 함께 성장하는 과학 멘토링 공간</p>
  </header>

  <main>
    <h2>활동 소개</h2>
    <section class="cards">
      <div class="card">
        <div class="icon">🧪</div>
        <h3>탐구 활동</h3>
        <p>궁금한 주제를 정하고 실험과 조사로 직접 답을 찾아갑니다.</p>
      </div>
      <div class="card">
        <div class="icon">💬</div>
        <h3>멘토링</h3>
        <p>멘토와 함께 질문을 나누고 탐구 방향에 대한 피드백을 받습니다.</p>
      </div>
      <div class="card">
        <div class="icon">📝</div>
        <h3>결과 정리</h3>
        <p>탐구 과정과 결과를 보고서와 발표 자료로 정리합니다.</p>
      </div>
    </section>

    <h2>할 일 목록</h2>
    <section class="todo">
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
        <button type="submit">추가</button>
      </form>
      <ul id="todo-list"></ul>
    </section>
  </main>

  <footer>© 2026 동아사이언스 멘토링</footer>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = '';
      todos.forEach((todo, i) => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          todos[i].done = checkbox.checked;
          save();
          render();
        });

        const text = document.createElement('span');
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.addEventListener('click', () => {
          todos.splice(i, 1);
          save();
          render();
        });

        li.append(checkbox, text, del);
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      save();
      render();
    });

    render();
  </script>
</body>
</html>
